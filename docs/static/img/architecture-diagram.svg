<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- React Native App -->
  <rect x="250" y="20" width="300" height="80" rx="8" fill="#1E293B" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">React Native App</text>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">User Actions • App Events</text>
  
  <!-- Raven Client Container -->
  <rect x="50" y="140" width="700" height="320" rx="12" fill="white" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">Raven Client</text>
  
  <!-- Event Processor -->
  <rect x="100" y="190" width="180" height="100" rx="6" fill="#e0f2fe" stroke="#10b981" stroke-width="2"/>
  <text x="190" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">Event Processor</text>
  <text x="190" y="235" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Receives and</text>
  <text x="190" y="250" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">processes events</text>
  <text x="190" y="275" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">from your app</text>
  
  <!-- State Machine -->
  <rect x="310" y="190" width="180" height="100" rx="6" fill="#fef3c7" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">State Machine</text>
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Evaluates</text>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">transitions and</text>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">conditions</text>
  
  <!-- CTA Handler -->
  <rect x="520" y="190" width="180" height="100" rx="6" fill="#fce7f3" stroke="#10b981" stroke-width="2"/>
  <text x="610" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">CTA Handler</text>
  <text x="610" y="235" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Executes actions</text>
  <text x="610" y="250" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">and manages</text>
  <text x="610" y="275" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">CTA lifecycle</text>
  
  <!-- Flow arrows between components -->
  <path d="M 280 240 L 310 240" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 490 240 L 520 240" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Nudges -->
  <rect x="150" y="330" width="150" height="100" rx="6" fill="#dbeafe" stroke="#10b981" stroke-width="2"/>
  <text x="225" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">Nudges</text>
  <text x="225" y="375" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Bottom Sheets</text>
  <text x="225" y="390" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">for contextual</text>
  <text x="225" y="405" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">messaging</text>
  
  <!-- Tooltips -->
  <rect x="500" y="330" width="150" height="100" rx="6" fill="#e0e7ff" stroke="#10b981" stroke-width="2"/>
  <text x="575" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">Tooltips</text>
  <text x="575" y="375" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Screen-based</text>
  <text x="575" y="390" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">guidance and</text>
  <text x="575" y="405" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">hints</text>
  
  <!-- Flow from CTA Handler to UI components -->
  <path d="M 400 290 L 225 330" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <path d="M 610 290 L 575 330" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  
  <!-- Backend API -->
  <rect x="250" y="490" width="300" height="80" rx="8" fill="#1E293B" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Backend API</text>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Configuration • Analytics • State Sync</text>
  
  <!-- Flow from App to SDK -->
  <path d="M 400 100 L 400 140" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Flow from SDK to Backend -->
  <path d="M 400 460 L 400 490" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
</svg>


