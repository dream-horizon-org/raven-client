<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#f8f9fa"/>
  
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">If button is "signup" → go to state "1"</text>
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">If button is "login" → go to state "2"</text>
  
  <rect x="50" y="70" width="160" height="60" rx="8" fill="#e0f2fe" stroke="#10b981" stroke-width="2"/>
  <text x="130" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">Button: signup</text>
  <text x="130" y="115" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Conditional check</text>
  
  <path d="M 210 100 L 240 100" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <rect x="240" y="70" width="130" height="60" rx="8" fill="#fef3c7" stroke="#10b981" stroke-width="2"/>
  <text x="305" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">State "1"</text>
  <text x="305" y="115" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Signup flow</text>
  
  <rect x="400" y="70" width="160" height="60" rx="8" fill="#fce7f3" stroke="#10b981" stroke-width="2"/>
  <text x="480" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">Button: login</text>
  <text x="480" y="115" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Conditional check</text>
  
  <path d="M 560 100 L 590 100" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <rect x="590" y="70" width="130" height="60" rx="8" fill="#dbeafe" stroke="#10b981" stroke-width="2"/>
  <text x="655" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">State "2"</text>
  <text x="655" y="115" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Login flow</text>
</svg>
