<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <rect x="250" y="30" width="300" height="70" rx="8" fill="#1E293B" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">State Reached</text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">State machine in target state</text>
  
  <path d="M 400 100 L 400 120" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <rect x="250" y="120" width="300" height="70" rx="8" fill="#e0f2fe" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">Lookup stateToAction</text>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Find action ID for state</text>
  
  <path d="M 400 190 L 400 210" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <rect x="250" y="210" width="300" height="70" rx="8" fill="#fef3c7" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">Find Action by actionId</text>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Get action configuration</text>
  
  <path d="M 400 280 L 400 300" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <rect x="250" y="300" width="300" height="70" rx="8" fill="#fce7f3" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">Check Action Type</text>
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">NUDGE_UI, TOOLTIP, etc.</text>
  
  <path d="M 400 370 L 400 390" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <rect x="250" y="390" width="300" height="70" rx="8" fill="#dbeafe" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">Execute Action</text>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Show UI or send event</text>
  
  <!-- Action types -->
  <rect x="50" y="470" width="160" height="30" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="130" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">NUDGE_UI</text>
  
  <rect x="220" y="470" width="160" height="30" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="300" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">NUDGE_POPUP</text>
  
  <rect x="390" y="470" width="160" height="30" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="470" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">TOOLTIP</text>
  
  <rect x="560" y="470" width="160" height="30" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="640" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">NUDGE_ACTION</text>
</svg>
