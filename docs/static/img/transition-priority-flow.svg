<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#f8f9fa"/>
  
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">1. Check if userType is "premium" → go to "1"</text>
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">2. Otherwise → go to "2"</text>
  
  <rect x="50" y="70" width="190" height="60" rx="8" fill="#e0f2fe" stroke="#10b981" stroke-width="2"/>
  <text x="145" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">userType: premium</text>
  <text x="145" y="115" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">First condition</text>
  
  <path d="M 240 100 L 270 100" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <rect x="270" y="70" width="130" height="60" rx="8" fill="#fef3c7" stroke="#10b981" stroke-width="2"/>
  <text x="335" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">State "1"</text>
  <text x="335" y="115" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Premium flow</text>
  
  <rect x="430" y="70" width="140" height="60" rx="8" fill="#fce7f3" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">Otherwise</text>
  <text x="500" y="115" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Default case</text>
  
  <path d="M 570 100 L 600 100" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <rect x="600" y="70" width="130" height="60" rx="8" fill="#dbeafe" stroke="#10b981" stroke-width="2"/>
  <text x="665" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">State "2"</text>
  <text x="665" y="115" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Standard flow</text>
</svg>
