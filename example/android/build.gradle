
buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.4")
    }
}

def printSample(){
  System.out.println("userName +" + System.getenv("GITHUB_USERNAME"))
  System.out.println("token +" + System.getenv("GITHUB_TOKEN"))
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri(project.findProperty("GITHUB_PACKAGES_REPO_URL") ?: "https://maven.pkg.github.com/dream11/ds-comms-android-sdk")
            credentials {
                username = project.findProperty("GITHUB_USERNAME") ?: System.getenv("GITHUB_USERNAME") ?: ""
                password = project.findProperty("GITHUB_TOKEN") ?: System.getenv("GITHUB_TOKEN") ?: ""
            }
            printSample()
        }
    }
}


apply plugin: "com.facebook.react.rootproject"
